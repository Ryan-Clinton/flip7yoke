<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132A74">
<title>Flip7yoke</title>
<link rel="preload" href="/fonts/bigshoulders-inline-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1><span class="wordmark">Flip<span class="seven">7</span>yoke</span><span class="night">Thursday game night</span></h1>
  <span class="mode" id="modeTag" hidden></span>
  <span class="dot" id="conn" title="Live connection"></span>
  <button id="shareBtn">Join</button>
  <button id="menuBtn">⋯</button>
</header>
<main id="app"></main>
<div class="footer" id="footer" hidden><button class="primary" id="commitBtn">Finish round</button></div>

<div class="sheet" id="entrySheet"><div id="entryBody"></div></div>
<div class="sheet" id="menuSheet"><div id="menuBody"></div></div>
<div class="sheet" id="shareSheet"><div>
  <h3>Join on your phone</h3>
  <p class="muted">Connect to the same Wi-Fi, then scan or type:</p>
  <div id="qr"></div>
  <div id="urls"></div>
  <div class="actions" style="grid-template-columns:1fr"><button data-close>Done</button></div>
</div></div>

<script src="/qrcode.min.js"></script>
<script src="/rules.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let S = null;

const BOARD = location.pathname.startsWith('/board');
document.body.classList.toggle('board', BOARD);
// This phone's player id. Per-device only, so a lost value just means tapping your name again.
const getMe = () => { try { return localStorage.getItem('flip7.me'); } catch { return null; } };
const setMe = id => { try { id ? localStorage.setItem('flip7.me', id) : localStorage.removeItem('flip7.me'); } catch {} render(); };
const ord = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');

const MODE_NAMES = { classic: 'Classic', vengeance: 'Vengeance', brutal: 'Brutal' };
const mode = () => S.mode || 'classic';
const veng = () => Rules.isVengeance(mode());
const entryScore = e => Rules.entryScore(e, mode());
const nameOf = id => (S.players.find(p => p.id === id) || {}).name || '?';
// Each player gets a colour from the deck's numerals, in the order they joined.
const DECK_COLOURS = ['#D9443A', '#2F8ED1', '#2BB0AC', '#8CC43F', '#E9B43C', '#B05FB0', '#8C6E5A'];
const pcOf = id => DECK_COLOURS[Math.max(0, S.players.findIndex(p => p.id === id)) % DECK_COLOURS.length];

const act = (type, args = {}) => fetch('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type, ...args }) });
const totals = () => Rules.totals(S);

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => $('#conn').classList.add('on');
  es.onerror = () => $('#conn').classList.remove('on');
  es.onmessage = ev => { S = JSON.parse(ev.data); render(); };
}

function render() {
  if (!S) return;
  const tag = $('#modeTag');
  tag.hidden = mode() === 'classic';
  tag.className = 'mode ' + mode();
  tag.textContent = MODE_NAMES[mode()];
  $('#menuBtn').hidden = !BOARD;
  $('#shareBtn').hidden = BOARD; // the board shows the join QR permanently
  if (BOARD) renderBoard(); else renderPhone();
  if ($('#menuSheet').classList.contains('open')) renderMenu();
}

function standings() {
  const tot = totals();
  const ranked = [...S.players].sort((a, b) => tot[b.id] - tot[a.id]);
  const best = ranked.length ? tot[ranked[0].id] : 0;
  const over = !!S.rounds.length && best >= S.target;
  const winners = ranked.filter(p => tot[p.id] === best);
  const banner = over ? `<div class="banner">🏆 ${winners.map(p => esc(p.name)).join(' & ')} win${winners.length > 1 ? '' : 's'} with ${best}!</div>` : '';
  return { tot, ranked, best, over, banner };
}

// ---- phone: join, then enter your own score each round ----
function renderPhone() {
  const app = $('#app');
  $('#footer').hidden = true;
  const me = S.players.find(p => p.id === getMe());
  if (!me) {
    app.innerHTML = `<div class="card"><h3 style="margin-top:0">What's your name?</h3>
      <form id="joinForm" class="row"><input placeholder="Your name" autocomplete="off" maxlength="20"><button class="primary">Join</button></form>
      ${S.players.length ? `<p class="muted" style="margin:14px 0 0">Already in the game? Tap your name:</p>
      <div class="who">${S.players.map(p => `<button data-me="${p.id}">${esc(p.name)}</button>`).join('')}</div>` : ''}
      ${(rest => rest.length ? `<p class="muted" style="margin:14px 0 0">Played before? Tap your name:</p>
      <div class="who">${rest.map(n => `<button data-join="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : '')(
        regulars.filter(n => !S.players.some(p => p.name.toLowerCase() === n.toLowerCase())))}</div>`;
    $('#joinForm').onsubmit = async ev => {
      ev.preventDefault();
      const name = ev.target.querySelector('input').value.trim();
      if (!name) return;
      const r = await act('addPlayer', { name });
      if (r.ok) setMe((await r.json()).id);
    };
    app.querySelectorAll('[data-me]').forEach(el => el.onclick = () => setMe(el.dataset.me));
    app.querySelectorAll('[data-join]').forEach(el => el.onclick = async () => {
      const r = await act('addPlayer', { name: el.dataset.join });
      if (r.ok) setMe((await r.json()).id);
    });
    return;
  }
  const { tot, ranked, over, banner } = standings();
  const rank = ranked.findIndex(p => p.id === me.id) + 1;
  const e = S.draft[me.id];
  const entered = Object.keys(S.draft).length;
  const left = S.target - tot[me.id];
  let html = banner + `<div class="card me" style="--pc:${pcOf(me.id)}">
      <div class="who-name">${esc(me.name)}</div>
      <div class="muted">${ord(rank)} of ${S.players.length}</div>
      <div class="total ${tot[me.id] < 0 ? 'neg' : ''}">${tot[me.id]}</div>
      <div class="muted">${left > 0 ? left + ' to go' : 'Target reached'}</div></div>`;
  if (!over || e) {
    html += `<div class="card">${e
      ? `<div style="text-align:center"><div class="done">✓ Round ${S.rounds.length + 1} score sent</div><div style="margin:6px 0 10px">${entryStatus(e)}</div>
         <button id="mine" style="width:100%">Change my score</button></div>`
      : (w => w && w.cards && w.cards.length
          ? `<button class="primary bigbtn" id="mine">Continue my hand (${entryScore(w)} so far)</button>`
          : `<button class="primary bigbtn" id="mine">Deal me in: round ${S.rounds.length + 1}</button>`)(loadWip(me.id))}
      <p class="muted" style="text-align:center;margin:10px 0 0">${S.finishing ? 'All scores in, finishing the round…' : `${entered} of ${S.players.length} scores in`}</p></div>`;
  }
  html += `<h2>Standings</h2><div class="card">${ranked.map((p, i) => `<div class="stand ${p.id === me.id ? 'you' : ''}">
      <span><i class="pc" style="background:${pcOf(p.id)}"></i>${i + 1}. ${esc(p.name)} ${S.draft[p.id] ? '<span class="done">✓</span>' : ''}</span><b class="${tot[p.id] < 0 ? 'neg' : ''}">${tot[p.id]}</b></div>`).join('')}</div>
    <p class="muted" style="text-align:center">Not ${esc(me.name)}? <button class="ghost" id="notMe">Switch player</button></p>`;
  app.innerHTML = html;
  const mine = $('#mine');
  if (mine) mine.onclick = () => openEntry(me.id);
  $('#notMe').onclick = () => setMe(null);
}

// ---- board: the big shared screen ----
function renderBoard() {
  const app = $('#app');
  if (!S.players.length) {
    app.innerHTML = `<div class="card"><h3 style="margin-top:0">Who's playing?</h3>
      <form id="addForm" class="row"><input id="newName" placeholder="Player name" autocomplete="off"><button class="primary">Add</button></form></div>`;
    $('#addForm').onsubmit = addPlayer;
    $('#footer').hidden = true;
    app.insertAdjacentHTML('beforeend', joinPanel());
    drawBoardQr();
    return;
  }
  const { tot, ranked, best, over, banner } = standings();
  let html = '<div>' + banner;
  if (S.finishing) html += `<div class="finishing">All scores in. Finishing round ${S.rounds.length + 1}…</div>`;
  html += ranked.map((p, i) => {
    const e = S.draft[p.id];
    const status = !e ? 'Waiting for score…' : `<span class="done">✓</span> ${entryStatus(e)}`;
    const left = Math.max(0, S.target - tot[p.id]);
    return `<div class="card player ${tot[p.id] === best && best > 0 ? 'lead' : ''}" data-pid="${p.id}" style="--pc:${pcOf(p.id)}">
      <div class="rank">${i + 1}</div><div class="name">${esc(p.name)}</div><div class="total ${tot[p.id] < 0 ? 'neg' : ''}">${tot[p.id]}</div>
      <div class="sub"><span>${status}</span><span>${left ? left + ' to go' : 'Target reached'}</span></div>
      <div class="bar"><i style="width:${Math.max(0, Math.min(100, tot[p.id] / S.target * 100))}%"></i></div></div>`;
  }).join('');

  if (S.rounds.length) {
    html += `<h2>Rounds</h2><div class="card scroll"><table><tr><th>#</th>${S.players.map(p => `<th>${esc(p.name)}<i style="background:${pcOf(p.id)}"></i></th>`).join('')}<th></th></tr>`;
    S.rounds.forEach((r, i) => {
      html += `<tr><td class="muted">${i + 1}</td>${S.players.map(p => (r.zero || []).includes(p.id)
        ? `<td class="ed wiped" data-r="${i}" data-p="${p.id}" data-v="${r.scores[p.id] ?? 0}" title="Total wiped to 0">⓪</td>`
        : `<td class="ed" data-r="${i}" data-p="${p.id}">${r.scores[p.id] ?? 0}</td>`).join('')}
        <td><button class="ghost" data-del="${i}">✕</button></td></tr>`;
    });
    html += `</table><p class="muted" style="margin:8px 0 0">Tap a score to fix it.${S.rounds.some(r => (r.zero || []).length) ? ' ⓪ = total wiped to 0 (type a score to undo).' : ''}</p></div>`;
  }
  html += '</div>' + joinPanel();
  app.innerHTML = html;
  drawBoardQr();

  app.querySelectorAll('[data-pid]').forEach(el => el.onclick = () => openEntry(el.dataset.pid));
  app.querySelectorAll('td.ed').forEach(el => el.onclick = () => {
    const v = prompt('New score', el.dataset.v ?? el.textContent);
    if (v !== null && v.trim() !== '' && !isNaN(+v)) act('editScore', { round: +el.dataset.r, id: el.dataset.p, score: +v });
  });
  app.querySelectorAll('[data-del]').forEach(el => el.onclick = () => {
    if (confirm(`Delete round ${+el.dataset.del + 1}?`)) act('deleteRound', { round: +el.dataset.del });
  });

  const entered = Object.keys(S.draft).length;
  $('#footer').hidden = over && !entered;
  $('#commitBtn').textContent = `Finish round ${S.rounds.length + 1} (${entered}/${S.players.length} scored)`;
}

// Join instructions stay on the board so people can scan whenever they sit down.
let joinUrls = null, regulars = [], wifi = null;
fetch('/api/info').then(r => r.json()).then(i => {
  const lan = i.urls.filter(u => /\/\/(192\.168|10\.)/.test(u));
  joinUrls = lan.length ? lan : i.urls;
  regulars = i.names || [];
  wifi = i.wifi || null;
  render();
}).catch(() => {});
function joinPanel() {
  const wifiStep = wifi ? `<div class="step"><span class="num">1</span> Join the Wi-Fi</div>
    <div id="wifiQr" class="qrbox"></div>
    <div class="wifiText">Network <b>${esc(wifi.ssid)}</b><br>Password <b>${esc(wifi.password)}</b></div>
    <div class="step"><span class="num">2</span> Open the game</div>` : `<p class="muted" style="margin:4px 0 0">Same Wi-Fi, then scan or type:</p>`;
  return `<div class="card joinPanel"><h3 style="margin:0">Join on your phone</h3>${wifiStep}
    <div id="boardQr" class="qrbox"></div>${(joinUrls || []).map(u => `<div class="url">${esc(u)}</div>`).join('')}</div>`;
}
function drawQr(box, text) {
  if (!box) return;
  if (!text || !window.qrcode) { box.hidden = true; return; }
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  box.innerHTML = q.createImgTag(6, 0);
}
function drawBoardQr() {
  drawQr($('#wifiQr'), wifi && wifi.qr);
  drawQr($('#boardQr'), joinUrls && joinUrls[0]);
}

function entryStatus(e) {
  const bits = [];
  if (e.bust) bits.push('<span class="bustTag">Bust</span>');
  if (!e.bust || entryScore(e)) bits.push(`<span class="pending">${entryScore(e) < 0 ? '' : '+'}${entryScore(e)} this round</span>`);
  if (mode() === 'brutal' && e.hit && Rules.isFlip7(e)) bits.push(`<span class="bustTag">−15 to ${esc(nameOf(e.hit))}</span>`);
  if (Rules.wipes(e)) bits.push('<span class="bustTag">Total wiped to 0</span>');
  return bits.join(' · ');
}

function addPlayer(ev) {
  ev.preventDefault();
  const inp = ev.target.querySelector('input');
  if (inp.value.trim()) act('addPlayer', { name: inp.value });
  inp.value = '';
  inp.focus();
}

// ---- round entry sheet ----
// A hand being dealt is kept on this device until it's saved, so a locked screen or a closed sheet loses nothing.
const wipKey = pid => `flip7.wip.${pid}.${S.rounds.length}`;
const loadWip = pid => { try { return JSON.parse(localStorage.getItem(wipKey(pid))); } catch { return null; } };
const saveWip = (pid, e) => { try { localStorage.setItem(wipKey(pid), JSON.stringify(e)); } catch {} };
const dropWip = pid => { try { localStorage.removeItem(wipKey(pid)); } catch {} };

let E, editing, H = [], note = '';
function openEntry(pid) {
  editing = pid;
  const cur = S.draft[pid] || loadWip(pid);
  E = cur ? JSON.parse(JSON.stringify(cur)) : { cards: [], mods: [], bust: false };
  E.cards ||= []; E.mods ||= [];
  H = []; note = '';
  drawEntry();
  $('#entrySheet').classList.add('open');
}

// Every change goes through here so Undo can step back one tap at a time.
function change(fn) {
  H.push(JSON.stringify(E));
  note = '';
  fn();
  if (!Rules.isFlip7(E)) delete E.hit;
  drawEntry();
}

// Deal one number card into the hand, applying bust / Second Chance / Lucky 13 automatically.
function deal(n, lucky) {
  const V = veng();
  const have = E.cards.filter(x => x === n).length;
  delete E.manual;
  if (E.bust || Rules.isFlip7(E)) { note = E.bust ? 'Already busted. Undo if that was a mistake.' : 'Already a Flip 7!'; return; }
  let ok = have === 0;
  if (V && n === 13) {
    if (lucky && E.lucky) { note = 'There is only one Lucky 13.'; return; }
    ok = have === 0 || (have === 1 && (lucky || E.lucky)); // Lucky 13 lets you hold one other 13
  }
  if (ok) {
    E.cards.push(n);
    if (lucky) E.lucky = true;
    if (V && n === 0) E.wipe = true; // The Zero: total wiped unless you Flip 7
    if (Rules.isFlip7(E)) note = 'FLIP 7! The round is over.';
  } else if (!V && E.chance) {
    E.chance = false;
    note = `Second Chance used: the extra ${n} is discarded.`;
  } else {
    E.bust = true; E.dup = n;
  }
}

// ---- card reader: photo -> local vision model on the computer -> hand to check ----
let scanning = false;
async function shrinkPhoto(file, max = 1024) { // the reader resizes anyway; smaller is a quicker upload
  const img = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.8).split(',')[1];
}
async function scanPhoto(file) {
  const pid = editing;
  scanning = true; note = ''; drawEntry();
  try {
    const r = await fetch('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: await shrinkPhoto(file) }) });
    const hand = await r.json();
    if (!r.ok) throw new Error(hand.error || 'The card reader failed.');
    scanning = false;
    if (editing !== pid) return;
    change(() => {
      const V = veng();
      E.cards = []; E.mods = hand.mods; E.bust = false;
      for (const k of ['x2', 'half', 'lucky', 'unlucky', 'chance', 'dup', 'manual', 'wipe']) delete E[k];
      for (const k of ['x2', 'half', 'lucky', 'unlucky', 'chance']) if (hand[k]) E[k] = true;
      for (const n of hand.cards) {
        const have = E.cards.filter(x => x === n).length;
        const ok = have === 0 || (V && n === 13 && have === 1 && E.lucky);
        if (ok) E.cards.push(n); else { E.bust = true; E.dup = n; }
      }
      if (V && E.cards.includes(0)) E.wipe = true;
      const seen = E.cards.length + E.mods.length + ['x2', 'half', 'chance'].filter(k => E[k]).length;
      note = !seen ? "Couldn't make out any cards. Try again closer, flat and in good light."
        : hand.deckHint === 'vengeance' ? 'These look like Vengeance cards but the game is on Classic rules. Switch rules in the ⋯ menu on the board, then snap again.'
        : 'Check these against your cards, then Save.';
    });
  } catch (e) {
    scanning = false;
    note = e.message === 'Failed to fetch' ? "Couldn't reach the computer." : e.message;
    if (editing === pid) drawEntry();
  }
}

function drawEntry() {
  const p = S.players.find(p => p.id === editing);
  const V = veng(), brutal = mode() === 'brutal';
  const score = entryScore(E);
  const flip7 = Rules.isFlip7(E);
  const manual = typeof E.manual === 'number';
  const hasZero = V && E.cards.includes(0);
  const zeroSaved = hasZero && flip7; // a Flip 7 cancels The Zero, so nothing gets wiped
  const done = E.bust || flip7;
  const caption = E.bust ? `BUST${Number.isInteger(E.dup) ? ` (second ${E.dup})` : ''}${score ? ', modifiers still hit' : ''}`
    : flip7 ? (brutal && E.hit ? `FLIP 7! −15 to ${esc(nameOf(E.hit))}` : 'FLIP 7! (+15 bonus)') + (zeroSaved ? ' · The Zero is cancelled' : '')
    : manual ? 'Typed score'
    : hasZero ? `The Zero: scores 0 unless you Flip 7 · ${E.cards.length}/7 cards`
    : `${E.cards.length}/7 cards`;

  const chips = E.cards.map((c, i) => `<button class="chip" data-rm="${i}">${V && c === 0 ? 'Zero' : c}<i>✕</i></button>`).join('')
    + (E.lucky ? '<span class="tagc">Lucky 13</span>' : '') + (E.unlucky ? '<span class="tagc">Unlucky 7</span>' : '')
    + (E.chance ? '<span class="tagc good">Second Chance held</span>' : '');
  const top = V ? 13 : 12;
  const numBtns = Array.from({ length: top + 1 }, (_, n) => {
    const c = E.cards.filter(x => x === n).length;
    return `<button data-n="${n}" class="${c === 2 ? 'two' : c ? 'on' : ''}">${V && n === 0 ? '0<span class="c">Zero</span>' : n}</button>`;
  }).join('');
  const special = V
    ? `<button data-lucky class="${E.lucky ? 'on' : ''}">Lucky 13</button><button data-unlucky class="${E.unlucky ? 'on' : ''}">Unlucky 7</button>`
    : `<button data-x2 class="${E.x2 ? 'on' : ''}">×2</button><button data-chance class="${E.chance ? 'on' : ''}">Second Chance</button>`;
  const modBtns = V
    ? `<button data-half class="${E.half ? 'on' : ''}">÷2</button>` + [2, 4, 6, 8, 10].map(m => `<button data-m="${m}" class="${E.mods.includes(m) ? 'on' : ''}">−${m}</button>`).join('')
    : [2, 4, 6, 8, 10].map(m => `<button data-m="${m}" class="${E.mods.includes(m) ? 'on' : ''}">+${m}</button>`).join('');
  const others = S.players.filter(o => o.id !== editing);
  const hitPicker = brutal && flip7 && others.length ? `
    <div class="label">Flip 7 bonus</div>
    <div class="hits"><button data-hit="" class="${!E.hit ? 'on' : ''}" style="background:${!E.hit ? 'var(--good)' : ''};color:${!E.hit ? '#1a1a1a' : ''}">+15 to me</button>
      ${others.map(o => `<button data-hit="${o.id}" class="${E.hit === o.id ? 'on' : ''}">−15 ${esc(o.name)}</button>`).join('')}</div>` : '';

  $('#entryBody').style.setProperty('--pc', pcOf(p.id));
  $('#entryBody').innerHTML = `
    <h3>${esc(p.name)}</h3>
    <div class="big ${score < 0 ? 'neg' : ''} ${E.bust ? 'busted' : ''}">${score}<small>${caption}${Rules.wipes(E) ? ' · total wiped to 0' : ''}</small></div>
    ${note ? `<div class="note">${esc(note)}</div>` : ''}
    <div class="hand">${chips || '<span class="muted">Tap each card as it\'s dealt to you</span>'}</div>
    <label class="snap ${scanning ? 'busy' : ''}"><input type="file" accept="image/*" capture="environment" id="snap" hidden ${scanning ? 'disabled' : ''}>${scanning ? 'Reading your cards…' : '📷 Snap my cards'}</label>
    <div class="label">Number cards</div>
    <div class="grid nums ${done ? 'dim' : ''}">${numBtns}</div>
    <div class="grid specials">${special}</div>
    <div class="label">Modifiers${brutal ? ' (count even if busted)' : ''}</div>
    <div class="grid mods" style="${V ? 'grid-template-columns:repeat(6,1fr)' : ''}">${modBtns}</div>
    ${hitPicker}
    <div class="row" style="margin-top:10px">
      <button data-undo style="flex:1" ${H.length ? '' : 'disabled'}>↶ Undo</button>
      <button class="bust ${E.bust ? 'on' : ''}" data-bust style="flex:1">Bust</button>
      <input type="number" inputmode="numeric" placeholder="or type score" id="manual" value="${manual ? E.manual : ''}" style="flex:1.3">
    </div>
    ${zeroSaved
      ? '<button class="saved" data-wipe disabled style="width:100%;margin-top:8px">Flip 7 beats The Zero: your total is safe</button>'
      : `<button class="wipe ${E.wipe ? 'on' : ''}" data-wipe style="width:100%;margin-top:8px">${E.wipe ? 'Total will be wiped to 0 (tap to cancel)' : BOARD ? 'Zero their total' : 'Zero my total'}</button>`}
    <div class="actions">
      <button data-clear>${S.draft[editing] ? 'Clear' : E.cards.length ? 'Start over' : 'Cancel'}</button>
      <button class="primary" data-save>Save ${score}</button>
    </div>
    <p class="muted" style="text-align:center"><button class="ghost" data-rename>Rename</button>${BOARD ? ' · <button class="ghost" data-remove>Remove player</button>' : ''}</p>`;
  if (!S.draft[editing]) saveWip(editing, E);

  const b = $('#entryBody');
  b.querySelector('#snap').onchange = ev => { const f = ev.target.files[0]; if (f) scanPhoto(f); };
  b.querySelectorAll('[data-n]').forEach(el => el.onclick = () => change(() => deal(+el.dataset.n)));
  b.querySelectorAll('[data-rm]').forEach(el => el.onclick = () => change(() => {
    const [gone] = E.cards.splice(+el.dataset.rm, 1);
    if (gone === 13 && E.lucky && !E.cards.includes(13)) delete E.lucky;
    if (gone === 0 && V) delete E.wipe;
    if (gone === 7) delete E.unlucky;
  }));
  if (V) {
    b.querySelector('[data-lucky]').onclick = () => change(() => deal(13, true));
    // Unlucky 7: throw away every other number and modifier card, keep only the 7.
    b.querySelector('[data-unlucky]').onclick = () => change(() => {
      if (E.bust || Rules.isFlip7(E)) return;
      E.cards = [7]; E.mods = []; E.half = false; E.unlucky = true;
      delete E.lucky; delete E.wipe; delete E.manual;
      note = 'Unlucky 7: everything else discarded.';
    });
    b.querySelector('[data-half]').onclick = () => change(() => { E.half = !E.half; });
  } else {
    b.querySelector('[data-x2]').onclick = () => change(() => { E.x2 = !E.x2; });
    b.querySelector('[data-chance]').onclick = () => change(() => { E.chance = !E.chance; });
  }
  b.querySelectorAll('[data-m]').forEach(el => el.onclick = () => change(() => {
    const m = +el.dataset.m;
    E.mods = E.mods.includes(m) ? E.mods.filter(x => x !== m) : [...E.mods, m];
  }));
  b.querySelectorAll('[data-hit]').forEach(el => el.onclick = () => change(() => {
    if (el.dataset.hit) E.hit = el.dataset.hit; else delete E.hit;
  }));
  b.querySelector('[data-undo]').onclick = () => { if (H.length) { E = JSON.parse(H.pop()); note = ''; drawEntry(); } };
  b.querySelector('[data-bust]').onclick = () => change(() => { E.bust = !E.bust; delete E.dup; });
  b.querySelector('[data-wipe]').onclick = () => change(() => { E.wipe = !E.wipe; });
  b.querySelector('#manual').onchange = ev => change(() => {
    const v = ev.target.value.trim();
    if (v === '' || isNaN(+v)) delete E.manual; else { E.manual = Math.trunc(+v); E.bust = false; }
  });
  b.querySelector('[data-save]').onclick = () => { act('setEntry', { id: editing, entry: E }); dropWip(editing); closeSheets(); };
  b.querySelector('[data-clear]').onclick = () => {
    if (S.draft[editing]) act('clearEntry', { id: editing });
    dropWip(editing);
    closeSheets();
    render();
  };
  b.querySelector('[data-rename]').onclick = () => {
    const n = prompt('Rename player', p.name);
    if (n && n.trim()) act('renamePlayer', { id: p.id, name: n });
    closeSheets();
  };
  if (BOARD) b.querySelector('[data-remove]').onclick = () => {
    if (confirm(`Remove ${p.name}? Their round scores are hidden too.`)) act('removePlayer', { id: p.id });
    closeSheets();
  };
}

// ---- menu ----
function renderMenu() {
  $('#menuBody').innerHTML = `
    <h3>Game</h3>
    <div class="label">Rules</div>
    <div class="seg">${Object.entries(MODE_NAMES).map(([k, v]) => `<button data-mode="${k}" class="${mode() === k ? 'on' : ''}">${v}</button>`).join('')}</div>
    <p class="muted" style="margin:6px 0 0">${{
      classic: 'Original Flip 7: cards 0-12, +2 to +10 and ×2 modifiers.',
      vengeance: 'With a Vengeance: cards 0-13, Lucky 13, The Zero, −2 to −10 and ÷2. Round scores never drop below 0.',
      brutal: 'Vengeance plus Brutal Mode: round scores can go negative, modifiers hit busted players, and a Flip 7 can take −15 off someone else.',
    }[mode()]}</p>
    <div class="label">Players</div>
    <div class="plist" style="margin-top:8px">${S.players.map(p => `<div class="row"><span style="flex:1">${esc(p.name)}</span><button class="ghost" data-rm="${p.id}">Remove</button></div>`).join('')}</div>
    <form id="menuAdd" class="row"><input placeholder="Add player" autocomplete="off"><button class="primary">Add</button></form>
    <div class="label">Winning score</div>
    <div class="row" style="margin-top:8px"><input type="number" inputmode="numeric" id="target" value="${S.target}"><button id="setTarget">Set</button></div>
    <div class="actions" style="grid-template-columns:1fr 1fr">
      <button class="danger" id="newGame">New game</button><button data-close>Done</button>
    </div>
    <p class="muted">New game keeps the players and wipes the scores.</p>`;
  $('#menuAdd').onsubmit = addPlayer;
  $('#menuBody').querySelectorAll('[data-rm]').forEach(el => el.onclick = () => {
    const p = S.players.find(p => p.id === el.dataset.rm);
    if (confirm(`Remove ${p.name}?`)) act('removePlayer', { id: p.id });
  });
  $('#menuBody').querySelectorAll('[data-mode]').forEach(el => el.onclick = () => {
    if (el.dataset.mode === mode()) return;
    if (Object.keys(S.draft).length && !confirm('Switching rules clears the scores entered for this round. Continue?')) return;
    act('setMode', { mode: el.dataset.mode });
  });
  $('#setTarget').onclick = () => act('setTarget', { target: +$('#target').value });
  $('#newGame').onclick = () => { if (confirm('Start a new game? All scores are cleared.')) { act('newGame'); closeSheets(); } };
  bindClose();
}

function closeSheets() { document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open')); }
function bindClose() { document.querySelectorAll('[data-close]').forEach(el => el.onclick = closeSheets); }
document.querySelectorAll('.sheet').forEach(s => s.onclick = ev => { if (ev.target === s) closeSheets(); });

$('#menuBtn').onclick = () => { renderMenu(); $('#menuSheet').classList.add('open'); };
$('#commitBtn').onclick = () => {
  const missing = S.players.filter(p => !S.draft[p.id]);
  if (missing.length && !confirm(`${missing.map(p => p.name).join(', ')} not scored yet. They get 0. Finish anyway?`)) return;
  act('commitRound');
};
$('#shareBtn').onclick = async () => {
  const { urls } = await (await fetch('/api/info')).json();
  const lan = urls.filter(u => /\/\/(192\.168|10\.)/.test(u));
  const list = lan.length ? lan : urls;
  $('#urls').innerHTML = list.map(u => `<div class="url">${esc(u)}</div>`).join('');
  if (window.qrcode && list[0]) {
    const q = qrcode(0, 'M'); q.addData(list[0]); q.make();
    $('#qr').innerHTML = q.createImgTag(6, 0);
    $('#qr').hidden = false;
  } else $('#qr').hidden = true;
  $('#shareSheet').classList.add('open');
};
bindClose();
connect();
</script>
</body>
